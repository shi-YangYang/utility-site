services:
  toupiao:
    build: .
    image: utility-site/toupiao:latest
    container_name: toupiao
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DIR: /app/data
      ICONS_DIR: /app/assets/icons
    ports:
      - "${HOST_PORT:-3001}:3001"
    volumes:
      # SQLite 数据（可写；宿主目录属主建议 1000，见 docs/README.md）
      - ./data:/app/data
      # 20 张候选图不在镜像里，只读挂载
      - ./assets/icons:/app/assets/icons:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
