# CD：只在手动触发时执行（Actions → CD → Run workflow），合并到 main 不会自动部署。
#
# 规则（用户 2026-09-19 定）：只有明确需要部署时才运行本工作流，目标可选
# 子项目名 / proxy / all，原样交给 deploy/scripts/deploy.sh 执行；
# 目标没有 docker-compose.yml / compose.yml 时脚本会明确报错。
#
# - 服务器凭据（SSH_HOST / SSH_USER / SSH_KEY）未配置时跳过并提示，不失败；
# - 还需要仓库变量 DEPLOY_PATH（服务器上仓库的绝对路径）。
#
# 约定见根 AGENTS.md 5.2 / 5.3；服务器准备与凭据配置见 deploy/README.md。
# 本文件位于仓库根 .github/，是经用户批准的唯一根目录结构例外（AGENTS.md 21.2）。

name: CD

on:
  workflow_dispatch:
    inputs:
      project:
        description: "要部署的目标（子项目名 / proxy / all）"
        required: true
        default: "recording"

permissions:
  contents: read

concurrency:
  group: deploy-manual
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检查服务器凭据是否已配置
        id: creds
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 SSH_HOST / SSH_USER / SSH_KEY，跳过部署；配置方法见 deploy/README.md"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH 部署到服务器
        if: steps.creds.outputs.ready == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          TARGET: ${{ inputs.project }}
        run: |
          set -eu
          if [ -z "${DEPLOY_PATH:-}" ]; then
            echo "::error::未配置仓库变量 DEPLOY_PATH（服务器上仓库的绝对路径）"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "==> 部署 $TARGET"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && git pull --ff-only && ./deploy/scripts/deploy.sh $TARGET"
